name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm test -- --configLoader native --maxWorkers=4
      - run: python -m pytest backend/tests -q
      - run: npm run build -- --configLoader native
      - run: python scripts/smoke_workspace_upgrade.py
      - run: python scripts/smoke_public_demo.py
      - run: python scripts/smoke_workspace_recovery.py
      - run: python scripts/smoke_journey_reliability.py
      - run: python scripts/smoke_production.py
      - name: Check deployable image
        run: docker build --target app -t worldos-check .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            artifacts/workspace-upgrade/
            artifacts/workspace-recovery/
            artifacts/journey-reliability/
            artifacts/public-demo/
          retention-days: 7

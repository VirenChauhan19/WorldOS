# OPTIONAL PAID deployment. Never select this file for the $0 hosting setup.
# Preserves the original Standard service and 5 GB disk for future production use.
services:
  - type: web
    name: worldos-inspect
    runtime: docker
    plan: standard
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.launch_render
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: worldos-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: WORLDOS_DEPLOYMENT
        value: public
      - key: WORLDOS_DATA_DIR
        value: /var/data/worldos
      - key: WORLDOS_STORAGE_MODE
        value: persistent
      - key: WORLDOS_AUTH_PASSWORD_HASH
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: WORLDOS_SAM_PROVIDER
        value: meta
      - key: WORLDOS_MUSE_PROVIDER
        value: auto
      - key: BASETEN_MUSE_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: WORLDOS_MUSE_MODEL
        value: muse-spark-1.3
      - key: WORLDOS_AI_TIMEOUT_SECONDS
        value: "45"
      - key: WORLDOS_MAX_UPLOAD_MB
        value: "12"
      - key: WORLDOS_BACKUPS_ENABLED
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

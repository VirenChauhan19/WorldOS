# $0 web compute: one Free service, no disk or managed database.
# All SQLite data, photos and sessions are ephemeral. See docs/V08_DEPLOYMENT.md.
services:
  - type: web
    name: worldos-inspect
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.launch_render
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: WORLDOS_DEPLOYMENT
        value: public
      - key: WORLDOS_DATA_DIR
        value: /tmp/worldos
      - key: WORLDOS_STORAGE_MODE
        value: ephemeral
      - key: WORLDOS_AUTH_PASSWORD_HASH
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: WORLDOS_SAM_PROVIDER
        value: meta
      - key: WORLDOS_MUSE_PROVIDER
        value: auto
      - key: BASETEN_MUSE_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: WORLDOS_MUSE_MODEL
        value: muse-spark-1.3
      - key: WORLDOS_AI_TIMEOUT_SECONDS
        value: "45"
      - key: WORLDOS_MAX_UPLOAD_MB
        value: "6"
      - key: WORLDOS_MAX_IMAGE_PIXELS
        value: "6000000"
      - key: WORLDOS_MAX_REQUEST_MB
        value: "12"
      - key: WORLDOS_MAX_CONCURRENT_WRITES
        value: "1"
      - key: WORLDOS_BACKUPS_ENABLED
        value: "0"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
